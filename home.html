
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home - TaskMate</title>

    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="home.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <a href="home.html" class="logo">TaskMate</a>

        <nav class="nav-links">
            <a href="home.html" class="active">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>

    <!-- Main Section -->
    <main class="home-container">

        <section class="todo-card">

            <h1>My To-Do List</h1>

            <p>Add your tasks and tick them off when they're done.</p>

            <!-- Task Input -->
            <form id="taskForm" class="task-input">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="What do you need to do?"
                    required
                >

                <button type="submit">Add</button>

            </form>

            <!-- Task Display -->
            <ul id="taskList"></ul>

            <!-- Task Count -->
            <p id="taskCount">0 task(s) left</p>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 TaskMate. Built by our team on GitHub.</p>
    </footer>

    <script src="home.js"></script>

</body>
</html>
